name: Create a release (react-native-skia)
on:
  workflow_dispatch:
jobs:
  build:
    if: ${{ github.repository == 'wcandillon/react-native-skia' && (github.ref_name == 'main' || github.ref_name == '2.x') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    env:
      WORKING_DIRECTORY: ./
      PACKAGE_NAME: react-native-skia
      REPOSITORY: wcandillon/react-native-skia
    concurrency:
      group: npm-react-native-skia-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build package and documentation
        run: yarn build

      # Configure semantic-release for this repository. The workspace keeps its
      # @shopify/react-native-skia name (the apps depend on it), so the packed
      # tarball is renamed to react-native-skia right after semantic-release-yarn
      # writes it to dist/, before it is published and attached to the release.
      # The 2.x branch is the maintenance branch (>=2.0.0 <3.0.0) for the Ganesh
      # v2 line on the release-2.x channel, which is also its npm dist-tag so
      # latest stays on main (npm rejects dist-tags that are a valid semver
      # range, such as 2.x).
      - name: Configure semantic-release
        working-directory: packages/skia
        run: |
          node -e "
            const fs = require('fs');
            const rc = JSON.parse(fs.readFileSync('.releaserc', 'utf8'));
            rc.repositoryUrl = 'https://github.com/' + process.env.REPOSITORY + '.git';
            rc.branches.unshift({ name: '2.x', range: '2.x', channel: 'release-2.x' });
            const exec = rc.plugins.find((p) => Array.isArray(p) && p[0] === '@semantic-release/exec');
            exec[1].prepareCmd = 'bash ../../.github/scripts/rename-package-tarball.sh dist';
            fs.writeFileSync('.releaserc', JSON.stringify(rc, null, 2) + '\n');
          "
          cat .releaserc

      - name: Build NPM Package
        working-directory: packages/skia
        run: |
          yarn release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ''
          NPM_TOKEN: ''
          NPM_CONFIG_PROVENANCE: true

      # semantic-release publishes its GitHub releases as the latest one. After
      # a 2.x release, hand that back to the version npm serves as latest.
      - name: Keep the latest GitHub release on main
        if: ${{ github.ref_name == '2.x' }}
        run: gh release edit "v$(npm view "$PACKAGE_NAME" dist-tags.latest)" --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

